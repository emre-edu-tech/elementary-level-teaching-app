{% extends "base.html" %}
{% block title %}Profilini Seç · SayıHarf{% endblock %}
{% block content %}
<h1 class="text-5xl font-extrabold">Profilini Seç</h1>

{% if profiles %}
<section class="flex flex-wrap justify-center gap-4">
  {% for p in profiles %}
  <form method="post" action="/profile">
    <input type="hidden" name="profile_id" value="{{ p.id }}">
    <button type="submit"
            class="flex min-w-16 min-h-16 flex-col items-center gap-2 rounded-3xl border-4 border-white bg-white p-6 shadow-lg hover:bg-amber-50">
      <span class="text-7xl">{{ p.avatar }}</span>
      <span class="text-2xl font-bold">{{ p.name }}</span>
    </button>
  </form>
  {% endfor %}
</section>
{% endif %}

<section class="w-full max-w-md rounded-3xl border-4 border-white bg-white p-8 shadow-lg">
  <h2 class="text-3xl font-extrabold">Yeni Profil</h2>
  <form method="post" action="/profile" class="flex flex-col gap-4">
    <label for="name" class="text-3xl font-bold">Adın ne?</label>
    <input id="name" name="name" maxlength="20" required autocomplete="off"
           class="min-h-16 rounded-3xl border-4 border-sky-200 px-6 py-3 text-3xl focus:outline-none">
    <div class="flex flex-wrap justify-center gap-3">
      {% for emoji in avatars %}
      <label>
        <input type="radio" name="avatar" value="{{ emoji }}" class="peer sr-only"
               {% if loop.first %}checked{% endif %}>
        <span class="flex h-16 w-16 items-center justify-center rounded-2xl bg-sky-100 text-4xl peer-checked:border-4 peer-checked:border-amber-400">{{ emoji }}</span>
      </label>
      {% endfor %}
    </div>
    <button type="submit"
            class="min-h-16 rounded-3xl bg-amber-400 px-8 text-3xl font-extrabold shadow-lg hover:bg-amber-300">Başla!</button>
  </form>
</section>
{% endblock %}
